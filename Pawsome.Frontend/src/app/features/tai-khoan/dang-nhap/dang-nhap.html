<div class="dang-nhap-container">
  <h2>Đăng nhập</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Vui lòng nhập email hợp lệ.</small>
      }
    </div>

    <div class="field">
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" formControlName="password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Vui lòng nhập mật khẩu.</small>
      }
    </div>

    @if (loiChung) {
      <div class="error error-chung">{{ loiChung }}</div>
    }

    <button type="submit" [disabled]="dangGui">
      {{ dangGui ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>

  <p>
    Chưa có tài khoản? <a routerLink="/tai-khoan/dang-ky">Đăng ký ngay</a>
  </p>
  <p>
    <a routerLink="/tai-khoan/quen-mat-khau">Quên mật khẩu?</a>
  </p>
</div>
