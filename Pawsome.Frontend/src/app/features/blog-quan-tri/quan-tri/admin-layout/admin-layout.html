<div class="KhungQuanTri">
  <aside class="SidebarQuanTri">
    <div class="LogoQuanTri">
      <i class="fa-solid fa-paw"></i>
      <span class="TenLogo">PawSome Admin</span>
    </div>
    <hr class="GachSidebar">
    <div class="TieuDeNhomMenu"><span class="ChuMucMenu">General</span></div>

    <nav class="MenuQuanTri">
      <a routerLink="dashboard" routerLinkActive="active" class="MucMenu" title="Overview">
        <i class="fa-solid fa-gauge-high"></i>
        <span class="ChuMucMenu">Overview</span>
      </a>
      <a routerLink="bao-cao" routerLinkActive="active" class="MucMenu" title="Reports">
        <i class="fa-solid fa-chart-line"></i>
        <span class="ChuMucMenu">Reports</span>
      </a>
      <a routerLink="san-pham" routerLinkActive="active" class="MucMenu" title="Products">
        <i class="fa-solid fa-box-open"></i>
        <span class="ChuMucMenu">Products</span>
      </a>
      <a routerLink="don-hang" routerLinkActive="active" class="MucMenu" title="Orders">
        <i class="fa-solid fa-truck-fast"></i>
        <span class="ChuMucMenu">Orders</span>
      </a>
      <a routerLink="nguoi-dung" routerLinkActive="active" class="MucMenu" title="Users">
        <i class="fa-solid fa-users"></i>
        <span class="ChuMucMenu">Users</span>
      </a>
      <a routerLink="ma-giam-gia" routerLinkActive="active" class="MucMenu" title="Coupons">
        <i class="fa-solid fa-ticket"></i>
        <span class="ChuMucMenu">Coupons</span>
      </a>
      <a routerLink="blog" routerLinkActive="active" class="MucMenu" title="Blog">
        <i class="fa-solid fa-newspaper"></i>
        <span class="ChuMucMenu">Blog</span>
      </a>
    </nav>

    <hr class="GachSidebar">
    <div class="TieuDeNhomMenu"><span class="ChuMucMenu">Moderation</span></div>

    <nav class="MenuQuanTri">
      <a routerLink="kiem-duyet-danh-gia" routerLinkActive="active" class="MucMenu" title="Review Moderation">
        <i class="fa-solid fa-star-half-stroke"></i>
        <span class="ChuMucMenu">Review Moderation</span>
      </a>
    </nav>
  </aside>

  <div class="KhungPhai">
    <header class="TopbarQuanTri">
      <div class="KhoangTrongTopbar"></div>

      <div class="KhungNguoiDung">
        <div class="ThongTinNguoiDung">
          <span class="TenNguoiDung">{{ nguoiDung?.hoTen ?? 'Administrator' }}</span>
          <span class="VaiTroNguoiDung">{{ nguoiDung?.role }}</span>
        </div>
        <div class="VongTronAvatar"><i class="fa-solid fa-user-tie"></i></div>
        <div class="GachTopbar"></div>
        <button type="button" class="NutDangXuat" (click)="dangXuat()" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="NoiDungQuanTri">
      <router-outlet></router-outlet>
    </main>

    <footer class="FooterQuanTri">
      <span>© 2026 Pawsome — Admin Area</span>
    </footer>
  </div>

  <button type="button" class="NutCuonLenDau" (click)="cuonLenDau()" title="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</div>
